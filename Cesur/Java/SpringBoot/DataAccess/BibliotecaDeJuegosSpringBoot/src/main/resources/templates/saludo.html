<!DOCTYPE html>
<html lang="en">
<head>

    <title>Saludo - Biblioteca de Juegos</title>

</head>
<body>
<div class="container">
    <header>
        <h1>Biblioteca de Juegos</h1>

        <a href="/" class="btn-volver">Volver</a>

    <footer>
        <p>Realizado por Daniel</p>
    </footer>
</div>

</html>
