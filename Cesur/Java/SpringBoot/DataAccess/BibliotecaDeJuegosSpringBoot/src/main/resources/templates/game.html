<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${game.title} + ' - Biblioteca de Juegos'">Detalle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header>
        <div class="header-top">
            <h1>Biblioteca de Juegos</h1>
            <a th:href="@{/nuevo}" class="btn btn-small">+ Añadir</a>
        </div>
        <nav class="header-nav">
            <a th:href="@{/}">Todos</a>
            <span th:each="p : ${platforms}">
                | <a th:href="@{/(platform=${p})}" th:text="${p}"></a>
            </span>
        </nav>
    </header>

    <main class="game-detail">
        <div class="detail-content">
            <img th:src="@{'https://picsum.photos/seed/'+${game.id}+'/250/300'}" alt="Game image" class="detail-image">
            <div class="detail-info">
                <h2 th:text="${game.title}"></h2>
                <p class="platform" th:text="${game.platform}"></p>
                <p class="year" th:text="${game.year}"></p>
            </div>
        </div><div class="description-box">
        <p th:text="${game.description}"></p>
    </div>
        <div class="form-buttons">
            <a th:href="@{/}" class="btn">Volver</a>
            <a th:href="@{'/juego/' + ${game.id} + '/editar'}" class="btn">Editar</a>
            <form th:action="@{'/juego/' + ${game.id} + '/eliminar'}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" onclick="return confirm('¿Eliminar este juego?')">Eliminar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Realizado por Daniel</p>
    </footer>
</div>
<script src="/js/header.js"></script>
</body>
</html>
